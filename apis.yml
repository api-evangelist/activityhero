name: ActivityHero
description: >-
  ActivityHero is an online marketplace connecting families with kids' camps,
  classes, and enrichment activities — a one-stop shop to find top-rated summer
  camps, holiday camps, and after-school classes near you across categories like
  art, science, sports, dance, and online programs. For activity providers it
  offers marketing and registration software (MarketingHero and custom
  registration software) plus programs for school districts. ActivityHero's
  developer surface is a provider integration built on outbound, HMAC-SHA256
  signed JSON webhooks (a Registration API and a Schedule API) rather than a
  public REST API; it was surfaced as a portfolio company of 500 Global and
  enriched into the API Evangelist network from its published help-center docs.
